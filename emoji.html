<!DOCTYPE html>

<head>
  <meta charset="utf8">
  <title>Discord emoji · Mia yun Ruse</title>
  <link rel="stylesheet" href="static/normalize.css">
  <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura.css" type="text/css">
  <link rel="stylesheet" href="static/style.css" type="text/css">
  <link rel="apple-touch-icon" sizes="180x180" href="static/icon180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="static/icon512.png">
  <link rel="icon" type="image/png" sizes="32x32" href="static/icon32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="static/icon16.png">
  <link rel="manifest" href="static/site.webmanifest">
</head>

<body>
  <div class="bottom-right-gradient"></div>
  <content>
    <header>
      <a href="/">
        <h3>
          <img width="64" src="static/icon512.png">
          Mia yun Ruse
        </h3>
      </a>
      <h1>Custom Discord emoji</h1>
    </header>
    <p>
      I don't really use these anymore but feel free to download and use!
    </p>
    <p>
      You can also download direct from the
      <a href="https://github.com/yunruse/yunruse.github.io/tree/production/static/emoji">GitHub directory</a>
      if that's quicker.
    </p>
    <div id="emoji">
      <p>Space</p>
      <img src="static/emoji/solar/mercury.png" title="solar/mercury" width=32>
      <img src="static/emoji/solar/venus.png" title="solar/venus" width=32>
      <span class='earth'> <img src="static/emoji/solar/earth.png" title="solar/earth" width=32></span>
      <img src="static/emoji/solar/moon.png" title="solar/moon" width=32>
      <img src="static/emoji/solar/mars.png" title="solar/mars" width=32>
      <img src="static/emoji/solar/ceres.png" title="solar/ceres" width=32>
      <img src="static/emoji/solar/jupiter.png" title="solar/jupiter" width=32>
      <img src="static/emoji/solar/saturn.png" title="solar/saturn" width=32>
      <img src="static/emoji/solar/saturn1.png" title="solar/saturn1" width=32><img src="static/emoji/solar/saturn2.png"
        title="solar/saturn2" width=32>
      <img src="static/emoji/solar/uranus.png" title="solar/uranus" width=32>
      <img src="static/emoji/solar/neptune.png" title="solar/neptune" width=32>
      <img src="static/emoji/solar/pluto.png" title="solar/pluto" width=32>
      <img src="static/emoji/solar/charon.png" title="solar/charon" width=32>
      <br>
      <img src="static/emoji/juwust.png" title="juwust" width=32>
      <img src="static/emoji/artemis1.png" title="artemis1" width=32>
      <p>Media</p>
      <img src="static/emoji/triforce.png" title="triforce" width=32>
      <img src="static/emoji/totk_link.png" title="totk_link" width=32>
      <img src="static/emoji/gift.png" title="gift" width=32>
      <img src="static/emoji/its_a_trap.png" title="its_a_trap" width=32>
      <img src="static/emoji/now_perish.png" title="now_perish" width=32>
      <img src="static/emoji/dorf.png" title="dorf" width=32>
      <img src="static/emoji/pippin_smile.gif" title="pippin_smile" width=32>
      <img src="static/emoji/dontbehasty.gif" title="dontbehasty" width=32>
      <p>General</p>
      <img src="static/emoji/pinkandbluefloyd.png" title="pinkandbluefloyd" width=32>
      <img src="static/emoji/sparkle_pinkbluewhite.png" title="sparkle_pinkbluewhite" width=32>
      <img src="static/emoji/blank.png" title="blank" width=32>
      <img src="static/emoji/limmy_i_dont_get_it.png" title="limmy_i_dont_get_it" width=32>
      <img src="static/emoji/ben_affleck_ugh.png" title="ben_affleck_ugh" width=32>
      <img src="static/emoji/tom_scott.png" title="tom_scott" width=32>
      <img src="static/emoji/cat_scott.png" title="cat_scott" width=32>
      <img src="static/emoji/sierpinsky.png" title="sierpinsky" width=32>
      <img src="static/emoji/lime.png" title="lime" width=32>
      <span class="hor"><img src="static/emoji/hor.png" title="hor" width=32><span class="se"><img
            src="static/emoji/sehor.png" title="sehor" width=32></span><img src="static/emoji/se.png" title="se"
          width=32></span>
      <br>
    </div>
    <style>
      #emoji {
        padding: 1em;
        background-color: #36393F;
        color: #DCDDDE;
      }

      img {
        margin: 0;
      }

      .se img {
        width: 0;
        height: 32px;
        transition: width 1s;
      }

      .hor:hover .se img {
        width: 32px;
      }

      .earth img {
        transition: transform 1s;
      }

      .earth:hover img {
        transform: rotate(180deg);
      }

      /* Discord font */
      @font-face {
        font-family: discord;
        font-style: normal;
        font-weight: 400;
        src: url(https://discord.com/assets/082e59042c15a057af01d5b717d01fb3.woff2) format("woff2")
      }

      #emoji {
        font-family: discord, sans-serif;
      }
    </style>
  </content>
</body>
